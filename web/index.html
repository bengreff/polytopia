<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polytopia engine — dev UI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2386ad5d'/><rect x='4' y='4' width='8' height='8' fill='%233fa9f5'/></svg>">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">POLYTOPIA <span class="sub">dev UI</span></div>
    <div id="engine-badge" class="badge">…</div>
    <div id="turnbar">
      <span class="kv"><span class="k">Turn</span><b id="turn-value">–</b></span>
      <span class="kv"><span class="k">Player</span><b id="player-value">–</b></span>
      <span class="kv"><span class="k">Phase</span><b id="phase-value" class="chip">–</b></span>
    </div>
    <div class="spacer"></div>
    <button id="btn-endturn" class="primary">End Turn</button>
    <button id="btn-deselect">Deselect</button>
    <button id="btn-reload">Reload Rules</button>
    <button id="btn-newgame">New Game…</button>
    <button id="btn-fit" title="Fit board to view (F)">Fit</button>
    <label class="toggle"><input type="checkbox" id="chk-ids"> tile ids</label>
  </header>

  <main>
    <div id="stage">
      <canvas id="map"></canvas>
      <div id="verbmenu" class="verbmenu" hidden></div>
      <div id="hint" class="hint" hidden></div>
      <div id="banner" class="banner" hidden></div>
    </div>

    <aside id="sidebar">
      <section class="panel">
        <h2>Players</h2>
        <div id="players"></div>
      </section>

      <section class="panel">
        <h2>Selection</h2>
        <div id="selection" class="muted">Nothing selected.</div>
      </section>

      <section class="panel">
        <h2>Actions <span id="actions-count" class="count"></span></h2>
        <div id="actions" class="muted">–</div>
      </section>

      <section class="panel grow">
        <h2>Log</h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>

  <dialog id="newgame-dialog">
    <form id="newgame-form" method="dialog">
      <h2>New game</h2>
      <div class="grid">
        <label>Width <input type="number" id="ng-width" value="11" min="4" max="40"></label>
        <label>Height <input type="number" id="ng-height" value="11" min="4" max="40"></label>
        <label>Seed <input type="number" id="ng-seed" value="12345"></label>
        <label>Turn limit <input type="number" id="ng-turnlimit" value="0" min="0"></label>
        <label>Mode
          <select id="ng-mode">
            <option value="domination">domination</option>
            <option value="perfection">perfection</option>
            <option value="glory">glory</option>
            <option value="creative">creative</option>
          </select>
        </label>
        <label>Opponents
          <select id="ng-opponents">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label>Your tribe <select id="ng-tribe"></select></label>
        <label>Opponent tribe <select id="ng-optribe"></select></label>
        <label>Difficulty
          <select id="ng-difficulty">
            <option>easy</option>
            <option selected>normal</option>
            <option>hard</option>
            <option>crazy</option>
          </select>
        </label>
        <label class="toggle wide"><input type="checkbox" id="ng-fog" checked> Fog of war</label>
      </div>
      <menu>
        <button value="cancel" id="ng-cancel">Cancel</button>
        <button value="start" id="ng-start" class="primary">Start</button>
      </menu>
    </form>
  </dialog>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
